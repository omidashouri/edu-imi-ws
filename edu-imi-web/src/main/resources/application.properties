spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
# Local/IDE default uses classpath keystore. Docker overrides via SERVER_SSL_* in .env (file:/certs/...).
server.ssl.key-store=${SERVER_SSL_KEY_STORE:classpath:keystore/omidashouri.jks}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:omidashouri}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE:JKS}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:omidashouri}
server.ssl.key-password=${SERVER_SSL_KEY_PASSWORD:omidashouri}

# Local/IDE defaults; Docker overrides via SPRING_DATASOURCE_* in .env
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//172.17.70.221:1521/dbcntrs.imi.ir}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:crm}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:imiApplication}

spring.jackson.use-jackson2-defaults=true
spring.jackson.time-zone=${SPRING_JACKSON_TIME_ZONE:GMT+3:30}


